<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            background-color: ivory;
            border: 1px solid black;
        }

        .outline {
            width: 100vw;
            height: 400px;
        }

        .child {
            /*vw, vh 기준은 document(브라우저 화면) */
            background-color: pink;
            border: 1px solid black;
            width: 40vw;
            height: 400px;
        }

        .outline1 {
            background-color: blue;
            border: 1px solid black;
            width: 100vw;
            height: 400px;
        }

        .man {
            background-color: gray;
            border: 1px solid black;
            width: 40vw;
            height: 400px;
        }

    </style>
</head>
<body>
    <div class="outline">
        <div class="child"></div>
    <div class="outline1">
        <div class="man"></div>
</body>
</html>
